{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="auth-layout">
  <section class="form-panel">
    <div class="form-heading"><span class="step-tag">ACCOUNT RECOVERY</span><h2>Forgot your password?</h2><p>Enter the email address on your account. If it matches, we will send a secure reset link.</p></div>
    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field">Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
      <button class="button primary button-wide" type="submit">Send reset link</button>
    </form>
    <p class="form-switch"><a href="{{ url_for('login') }}">Back to sign in</a></p>
  </section>
</section>
{% endblock %}
