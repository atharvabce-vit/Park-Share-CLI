{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<section class="auth-layout">
  <section class="form-panel">
    <div class="form-heading"><span class="step-tag">ACCOUNT RECOVERY</span><h2>Choose a new password</h2><p>Use at least eight characters and include a number.</p></div>
    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field">New password<input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
      <label class="field">Confirm password<input name="confirm_password" type="password" autocomplete="new-password" required minlength="8"></label>
      <button class="button primary button-wide" type="submit">Update password</button>
    </form>
  </section>
</section>
{% endblock %}
